name: Dev Build

# On-demand build of every companion package without cutting a release.
# Trigger from the Actions tab, pick a branch, then download the packages from
# this run's artifacts. No tag, no GitHub Release. The Windows MSI and macOS
# DMG bundle their own JRE, so the target machine needs nothing installed.
#
# These are built on the 'dev' channel (app-channel: dev), so each package
# installs as a SEPARATE app ("PulseWeaver Companion Dev") alongside a release,
# with its own config, saved state, and logs — testing a dev build never touches
# a real install. Because dev is its own app, the version only has to stay
# monotonic within the channel for dev-over-dev upgrades, so 1.0.<run_number>
# (strictly higher each run) is all that's needed — notably a clean MSI upgrade
# on Windows, which enforces version ordering and has no debug bypass.
#
# Android builds the release variant, signed with the dev channel's own keystore.
# Android refuses an update whose signing key differs from the installed app's,
# and a debug APK is signed by a throwaway keystore the runner generates for that
# run, so no two dev APKs would ever install over each other. The key is separate
# from the release one on purpose: this workflow builds any branch on demand and
# Gradle runs that branch's scripts, so the key it holds must not be able to sign
# an update for a real install. The '.dev' applicationId suffix is what keeps the
# dev app itself separate from a release.

on:
  workflow_dispatch:

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        run: echo "ref=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: label
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            task: ':androidApp:assembleRelease'
            dir: androidApp/build/outputs/apk/release
            # Matches only the signed APK; without the keystore AGP emits
            # '*-release-unsigned.apk' and the run fails instead of publishing
            # something no device will install.
            pattern: '*-release.apk'
            suffix: android.apk
          # One runner builds one architecture — see the note in release.yml.
          # This matrix mirrors the release matrix so a dev build covers every
          # package a release ships, and nothing more.
          - runs-on: ubuntu-latest
            task: ':shared:packageDeb'
            dir: shared/build/compose/binaries/main/deb
            pattern: '*.deb'
            suffix: linux-amd64.deb
          - runs-on: ubuntu-24.04-arm
            task: ':shared:packageDeb'
            dir: shared/build/compose/binaries/main/deb
            pattern: '*.deb'
            suffix: linux-arm64.deb
          - runs-on: macos-latest
            task: ':shared:packageDmg'
            dir: shared/build/compose/binaries/main/dmg
            pattern: '*.dmg'
            suffix: macos-arm64.dmg
          - runs-on: windows-latest
            task: ':shared:packageMsi'
            dir: shared/build/compose/binaries/main/msi
            pattern: '*.msi'
            suffix: windows-x64.msi
    uses: ./.github/workflows/_build.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      gradle-task: ${{ matrix.task }}
      artifact-dir: ${{ matrix.dir }}
      artifact-pattern: ${{ matrix.pattern }}
      output-name: PulseWeaver-Companion-${{ needs.label.outputs.ref }}-${{ matrix.suffix }}
      app-version: 1.0.${{ github.run_number }}
      app-channel: dev
      keystore: ${{ matrix.suffix == 'android.apk' && 'dev' || '' }}
    # Only the dev key is passed down; 'secrets: inherit' would put the release
    # key inside a build of an arbitrary branch.
    secrets:
      DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
      DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
      DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
